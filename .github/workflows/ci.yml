name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --version
      - run: make check

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install kind if the runner lacks it
        run: |
          if ! command -v kind >/dev/null; then
            curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
            curl -fsSLo kind.sha256 https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64.sha256sum
            echo "$(cut -d' ' -f1 kind.sha256)  kind" | sha256sum -c -
            sudo install -m 0755 kind /usr/local/bin/kind
          fi
          kind version
          kubectl version --client
      - run: kind create cluster --wait 120s
      - run: make e2e

  herdr-check:
    name: herdr-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Herdr's own installer: latest release, checksum verified, into ~/.local.
      - name: Install Herdr
        run: |
          curl -fsSL https://releases.herdr.dev/app/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: herdr-app --version
      - run: make herdr-check

  conventional-commits:
    name: conventional-commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate PR title and non-merge commit subjects
        run: node scripts/check-commits.mjs --event "$GITHUB_EVENT_PATH"
